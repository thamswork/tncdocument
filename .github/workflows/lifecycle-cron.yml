name: Document Lifecycle Sweep

on:
  schedule:
    # Runs daily at 19:00 UTC = 02:00 Bangkok time (quiet hours, low traffic)
    - cron: '0 19 * * *'
  workflow_dispatch: {} # allows manually triggering from the GitHub Actions tab too

jobs:
  flag-stale:
    runs-on: ubuntu-latest
    steps:
      - name: Flag documents idle 5+ days
        run: |
          curl -s -X POST https://tncdocument.pages.dev/documents/api/cron/flag-stale \
            -H "x-cron-secret: tnc-cron-8f3a1c9e2b7d4f6a0193" \
            -H "Origin: https://tncdocument.pages.dev" \
            -w "\nHTTP status: %{http_code}\n"

  purge-expired:
    runs-on: ubuntu-latest
    needs: flag-stale
    steps:
      - name: Permanently delete documents removed 45+ days ago
        run: |
          curl -s -X POST https://tncdocument.pages.dev/documents/api/cron/purge-expired \
            -H "x-cron-secret: tnc-cron-8f3a1c9e2b7d4f6a0193" \
            -H "Origin: https://tncdocument.pages.dev" \
            -w "\nHTTP status: %{http_code}\n"
